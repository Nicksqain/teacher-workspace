<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="./login.css">
    <script type="module" src="./login.js"></script>
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">

            <h1 id="login-title"> С возвращением </h1>
            <p class="subtitle">
                Войдите, чтобы открыть расписание и управлять занятиями
            </p>

            <form id="login-form">
                <div class="field">
                    <label for="email"">Email</label>
                    <input id="email" name="email" type="email" placeholder="name@exampla.com" autocomplete="username" required/>
                </div>
                <div class="field">
                    <label for="password"">Пароль</label>
                    <input id="password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required/>
                </div>

                <button type="submit">Войти</button>
                <p id="login-status" role="status"></p>
            </form>

            <p class="login-help">Нет доступа? Обратитесь к администратору</p>
        </section>
    </main>
</body>
</html>
