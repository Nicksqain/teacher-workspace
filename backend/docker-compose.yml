version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tw_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Защищаем порт: доступен только с локального хоста (или убираем ports полностью для продакшена)
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workspace_network

  redis:
    image: redis:7-alpine
    container_name: tw_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - workspace_network

networks:
  workspace_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
